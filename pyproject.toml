[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "shawaf-vlm"
version = "0.1.17"
description = "Stage 1 text-to-tracklet video-language retrieval for SHAWAF"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "tqdm>=4.66",
]


[project.optional-dependencies]
xclip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
]
languagebind = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "peft>=0.10",
]
internvideo2 = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "open-clip-torch>=2.24",
]
all = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "peft>=0.10",
    "timm>=1.0",
    "open-clip-torch>=2.24",
    "huggingface_hub>=0.23",
    "opencv-python-headless>=4.8",
    "gdown>=5.2",
]
test = [
    "pytest>=8",
]
openai_clip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10.0",
    "clip @ git+https://github.com/openai/CLIP.git",
]
jina_clip_v2 = [
    "torch>=2.1",
    "transformers==4.57.3",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
]
gme_qwen2_vl = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.51.3",
    "sentence-transformers==5.1.2",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
]
qwen3_vl_embedding = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57.3,<4.58",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
]
extended_modern = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.57.3",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "clip @ git+https://github.com/openai/CLIP.git",
]
extended_gme = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.51.3",
    "sentence-transformers==5.1.2",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
]


[project.scripts]
shawaf-vlm-eval = "shawaf_vlm.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["shawaf_vlm*"]
