[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "shawaf-vlm"
version = "0.1.0"
description = "Stage 1 text-to-tracklet video-language retrieval for SHAWAF"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "tqdm>=4.66",
]


[project.optional-dependencies]
xclip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
]
languagebind = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
]
internvideo2 = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
]
all = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "huggingface_hub>=0.23",
    "opencv-python-headless>=4.8",
]
test = [
    "pytest>=8",
]


[project.scripts]
shawaf-vlm-eval = "shawaf_vlm.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["shawaf_vlm*"]
