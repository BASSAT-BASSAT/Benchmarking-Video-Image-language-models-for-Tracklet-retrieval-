[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "shawaf-vlm"
version = "0.1.18"
description = "Stage 1 text-to-tracklet video-language retrieval for SHAWAF"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "tqdm>=4.66",
]


[project.optional-dependencies]
xclip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
]
languagebind = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "peft>=0.10",
]
internvideo2 = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "open-clip-torch>=2.24",
]
all = [
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40,<5",
    "accelerate>=0.30",
    "pillow>=10.0",
    "einops>=0.7",
    "peft>=0.10",
    "timm>=1.0",
    "open-clip-torch>=2.24",
    "huggingface_hub>=0.23,<1.0",
    "opencv-python-headless>=4.8",
    "gdown>=5.2",
]
test = [
    "pytest>=8",
]
dev = [
    "pytest>=8",
    "transformers>=4.40,<5",
    "huggingface-hub>=0.23,<1.0",
]
demo = [
    # Gradio 5+ pulls huggingface-hub>=1.x, which breaks transformers 4.x in the ML env.
    "gradio>=4.44,<5",
    # Gradio 4.44 breaks with FastAPI 0.12x + Starlette 1.x (Jinja template TypeError on /).
    "fastapi>=0.115.2,<0.116",
    "starlette>=0.40.0,<0.46.0",
    "qdrant-client>=1.9",
    "opencv-python-headless>=4.8",
    "imageio-ffmpeg>=0.5.1",
    "huggingface-hub>=0.23,<1.0",
    "audioop-lts>=0.2.1; python_version>='3.13'",
]
openai_clip = [
    "torch>=2.1",
    "torchvision>=0.16",
    "pillow>=10.0",
    "clip @ git+https://github.com/openai/CLIP.git",
]
jina_clip_v2 = [
    "torch>=2.1",
    "transformers==4.57.3",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
]
gme_qwen2_vl = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.51.3",
    "sentence-transformers==5.1.2",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
]
qwen3_vl_embedding = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57.3,<4.58",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
]
extended_modern = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.57.3",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
    "einops>=0.7",
    "timm>=1.0",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "clip @ git+https://github.com/openai/CLIP.git",
]
extended_gme = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers==4.51.3",
    "sentence-transformers==5.1.2",
    "qwen-vl-utils>=0.0.14",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
]
embeddinggemma2 = [
    "torch>=2.8,<2.9",
    "torchvision>=0.23,<0.24",
    "transformers>=4.57.3",
    # Hub checkpoint is built for ST 6.1+ (sentence_transformers.base modules). Uninstall torchcodec on Kaggle.
    "sentence-transformers>=6.1.0,<7.0",
    "accelerate>=0.30",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "huggingface_hub>=0.23",
    "pandas>=2.0",
    "gdown>=5.2",
]


[project.scripts]
shawaf-vlm-eval = "shawaf_vlm.cli:main"


[tool.setuptools.packages.find]
where = ["."]
include = ["shawaf_vlm*"]

[tool.setuptools.package-data]
"shawaf_vlm.data" = ["*.json"]
